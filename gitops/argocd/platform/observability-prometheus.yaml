# Prometheus, the Prometheus Operator, kube-state-metrics and node-exporter.
#
# Conflict note: a manual kube-prometheus install in ns 'monitoring' (the old
# pre-GitOps way) would fight this operator over the CRDs — uninstall it first:
#   helm uninstall kube-prometheus -n monitoring
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-prometheus
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default

  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: "88.2.0"
      helm:
        valueFiles:
          - $values/gitops/observability/prometheus-values.yaml

    - repoURL: https://github.com/Mujakkir-Pathan/AI-BankApp-DevOps.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: observability

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
