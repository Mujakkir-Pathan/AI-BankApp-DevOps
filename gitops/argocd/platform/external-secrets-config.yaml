# The ClusterSecretStore, split from the operator for the same reason as
# cert-manager-config: a ClusterSecretStore is a custom resource, so its CRD
# has to be registered first. Wave 0 installs, wave 1 configures.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default

  source:
    repoURL: https://github.com/Mujakkir-Pathan/AI-BankApp-DevOps.git
    targetRevision: main
    path: gitops/external-secrets

  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
