# Let's Encrypt STAGING issuer — use this first; the staging CA has aggressive
# rate limits that burn the prod quota on a broken solver.
#
# The PROD issuer (letsencrypt-prod) lives in k8s/cert-manager.yml and is
# synced by the `bankapp` Application; this file is synced by the
# `cert-manager-config` Application (gitops/argocd/platform/cert-manager-config.yaml).
# Different resources — the two apps never touch the same object.
#
# Uses HTTP-01 validation via Gateway API — cert-manager creates a temporary
# HTTPRoute to serve the ACME challenge on port 80.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: mentor@trainwithshubham.com
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - group: gateway.networking.k8s.io
                kind: Gateway
                name: bankapp-gateway
                namespace: bankapp
