# Authless on purpose: the ESO pod gets credentials from its EKS Pod
# Identity association (terraform/secrets.tf), so the AWS SDK default chain
# is enough — no secret keys stored anywhere.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager

      region: us-west-2
