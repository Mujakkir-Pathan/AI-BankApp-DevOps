name: Dependency Scan

on:
  workflow_call:

jobs:
  dependency-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make reports dir
        run: mkdir -p reports

      # OWASP Dependency-Check: the Maven equivalent of govulncheck /
      # npm audit / pip-audit. Heavy on the first run (NVD feed); the
      # NVD_API_KEY secret (optional) makes it dramatically faster.
      - name: OWASP Dependency-Check (Maven SCA)
        continue-on-error: true
        uses: dependency-check/Dependency-Check_Action@main
        with:
          path: '.'
          format: 'HTML'
          out: 'reports'
          project: 'AI-BankApp-DevOps'
          args: >-
            --nvdValidForHours 24
            --cveValidForHours 24

      - name: Trivy filesystem scan (dependencies + IaC)
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: '.'
          format: 'table'
          output: 'reports/trivy-fs-report.txt'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          ignore-unfixed: true

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-scan-report
          path: reports/
          retention-days: 5
