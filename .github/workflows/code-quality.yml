name: Code Quality

on:
  workflow_call:

jobs:
  sast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile check
        run: ./mvnw -B -ntp -q compile

      - name: Checkstyle (static analysis)
        run: |
          ./mvnw -B -ntp org.apache.maven.plugins:maven-checkstyle-plugin:3.6.0:check \
            -Dcheckstyle.config.location=config/checkstyle/checkstyle.xml \
            -Dcheckstyle.consoleOutput=true

      - name: Workflow YAML lint (yamllint)
        run: |
          pip install yamllint
          yamllint -d "{extends: default, rules: {line-length: disable, truthy: disable, comments: disable, document-start: disable}}" .github/workflows
