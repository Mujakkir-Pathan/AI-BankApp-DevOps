# Dependency updates.
#
# Pinning a version (Maven deps, .terraform.lock.hcl, action tags) makes
# builds reproducible; Dependabot is what stops "reproducible" from quietly
# meaning "reproducibly vulnerable".
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directory: /terraform
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directory: /terraform/bootstrap
    schedule:
      interval: monthly
