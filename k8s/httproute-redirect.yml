# HTTP (:80) → HTTPS (:443) 301 redirect.
#
# Does not break ACME: the cert-manager solver's temporary HTTPRoute uses an
# Exact path match, which beats this PathPrefix match in Gateway API
# precedence. sectionName is required — without it this would also attach to
# :443 and loop.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bankapp-https-redirect
  namespace: bankapp
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: bankapp-gateway
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
