# Replaces the old plaintext k8s/secrets.yml. Requires:
#   1. terraform apply (creates the secret container)
#   2. terraform output -raw set_bankapp_secret | bash  (sets the value)
#   3. External Secrets Operator + ClusterSecretStore installed
#      (gitops/argocd/platform.yaml)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bankapp-secret
  namespace: bankapp
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore

  target:
    name: bankapp-secret
    creationPolicy: Owner
    deletionPolicy: Delete

  # The JSON keys already match the Secret keys the Deployments expect
  # (MYSQL_ROOT_PASSWORD / MYSQL_USER / MYSQL_PASSWORD), so no template.
  dataFrom:
    - extract:
        key: bankapp/mysql
